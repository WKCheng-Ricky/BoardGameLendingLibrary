services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '${FRONTEND_PORT:-5175}:5173'
        volumes:
            - '.:/app'
            - '/app/node_modules'
        environment:
            CHOKIDAR_USEPOLLING: 'true'
        networks:
            - sail
networks:
    sail:
        driver: bridge
